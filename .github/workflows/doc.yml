name: Build & Publish Doc

on:
  push:
    branches:
      - main
      - docs/**
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

jobs:

  Build-Doc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: 📥 checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: 🔧 setup uv
      uses: ./.github/uv
    - name: ⚙️ install deps
      run: uv sync --group docs
    - name: 📙 mkdocs build
      run: uv run mkdocs build
    - name: 📦 Upload artifacts
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  Publish-Doc:
    needs: Build-Doc
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
