name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'hadrien/FastSQLA' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This workflow reads PR metadata only; never check out or execute PR code.
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GitHub
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: hadrien/FastSQLA
          identity: dependabot

      - name: Enable auto-merge after the release cooldown
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          # App bypass applies to both policies; require checks before an immediate merge.
          if gh pr checks "$PR_URL" --required; then
            gh pr merge --squash --match-head-commit "$PR_HEAD" "$PR_URL"
          else
            # GraphQL variables are passed separately from the query text.
            # shellcheck disable=SC2016
            gh api graphql -f query='
              mutation($id: ID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                  pullRequest { number }
                }
              }' -f id="$PR_ID"
          fi
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
