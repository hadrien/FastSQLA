name: Release & Publish

on:
  push:
    branches:
      - main

jobs:

  Release-And-Publish:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
      statuses: write
    steps:
    - name: 📥 checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: 🔧 setup uv
      uses: ./.github/uv
    - name: 📜 semantic release version & publish on PyPI
      run: |
        next_version=$(uv run semantic-release version --print)
        last_released_version=$(uv run semantic-release version --print-last-released)
        if [[ "$next_version" == "$last_released_version" ]]; then
          echo "🙅🏽 Nothing to publish"
        else
          release_tag=$(uv run semantic-release version --print-tag)
          uv run semantic-release version --no-push --no-vcs-release
          release_sha=$(git rev-parse HEAD)
          release_branch="release/${release_tag}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${release_branch}"
          release_pr_body=$'# Problem\n\n- Generated release metadata must pass protected-main checks.\n\n# Solution\n\n- Apply the version and changelog generated by Python Semantic Release.'
          release_pr_url=$(gh pr create \
            --base main \
            --head "$release_branch" \
            --title "chore(release): ${release_tag}" \
            --body "$release_pr_body")
          release_pr_number=$(gh pr view "$release_pr_url" --json number --jq .number)
          gh workflow run ci.yml --ref "$release_branch"

          ci_run_id=""
          for _ in {1..120}; do
            ci_run_id=$(gh run list \
              --workflow ci.yml \
              --branch "$release_branch" \
              --commit "$release_sha" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
            if [[ -n "$ci_run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$ci_run_id" ]]; then
            echo "CI did not start for release commit $release_sha" >&2
            exit 1
          fi

          gh run watch "$ci_run_id" --exit-status
          ci_run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}"
          successful_jobs=$(gh run view "$ci_run_id" \
            --json jobs \
            --jq '.jobs[] | select(.conclusion == "success") | .name')
          if [[ -z "$successful_jobs" ]]; then
            echo "CI run $ci_run_id had no successful jobs" >&2
            exit 1
          fi
          while IFS= read -r context; do
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${release_sha}" \
              -f state=success \
              -f context="$context" \
              -f description="Passed in CI run ${ci_run_id}" \
              -f target_url="$ci_run_url" >/dev/null
          done <<< "$successful_jobs"

          merge_response=$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${release_pr_number}/merge" \
            -f merge_method=squash \
            -f sha="$release_sha" \
            -f commit_title="chore(release): ${release_tag}" \
            -f commit_message="Automatically generated by python-semantic-release")
          if [[ "$(jq -r .merged <<< "$merge_response")" != "true" ]]; then
            jq -r .message <<< "$merge_response" >&2
            exit 1
          fi

          merge_sha=$(jq -r .sha <<< "$merge_response")
          git fetch origin main
          git merge-base --is-ancestor "$merge_sha" origin/main
          git tag --force --annotate "$release_tag" "$merge_sha" --message "$release_tag"
          git push origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
          if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null; then
            git push origin --delete "$release_branch"
          fi
          gh workflow run doc.yml --ref "$release_tag"
          uv run semantic-release changelog --post-to-release-tag "$release_tag"
          echo "🙆🏽 Publishing on PyPI"
          uv build
          uv run twine upload dist/*
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
