[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FastSQLA"
version = "0.9.2"
description = "SQLAlchemy extension for FastAPI that supports asynchronous sessions and includes built-in pagination."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Hadrien David", email = "h@driendavid.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Framework :: Pydantic",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Programming Language :: SQL",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
]
keywords = ["fastapi", "sqlalchemy", "async", "session", "pagination", "sqlmodel"]
dependencies = ["fastapi>=0.115.6", "sqlalchemy[asyncio]>=2.0.37", "structlog>=24.4.0"]

[project.urls]
Homepage = "https://hadrien.github.io/FastSQLA/"
Documentation = "https://hadrien.github.io/FastSQLA/"
Repository = "https://github.com/hadrien/fastsqla"
Issues = "https://github.com/hadrien/fastsqla/issues"
Changelog = "https://github.com/hadrien/fastsqla/releases"

[project.optional-dependencies]
sqlmodel = ["sqlmodel>=0.0.22"]

[tool.uv]
package = true

[dependency-groups]
docs = [
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-llmstxt>=0.5.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.0",
    "pygments @ git+https://github.com/pygments/pygments.git@b6f6dab78e13652741d5e5811b4256b4dcb5fcd8",
]
dev = [
    "asgi-lifespan>=2.1.0",
    "coverage>=7.6.1",
    "faker>=28.4.1",
    "httpx>=0.27.2",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-watch",
    "ruff>=0.6.4",
    "toml>=0.10.2",
    "aiosqlite>=0.20.0",
    "python-semantic-release>=9.8.8",
    "twine>=5.1.1",
    "pdbpp>=0.11.7",
]

[tool.uv.sources]
pytest-watch = { git = "https://github.com/styleseat/pytest-watch", rev = "0342193" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

filterwarnings = ["ignore::DeprecationWarning:"]

[tool.coverage.run]
branch = true
omit = ["tests/*", ".venv/*"]
concurrency = ["thread", "greenlet"]

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
build_command = """
uv lock &&
git add uv.lock &&
uv build &&
uv run twine check dist/*
"""
commit_message = """\
chore(release): v{version}

Automatically generated by python-semantic-release
"""

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["build", "ci", "docs", "fix", "perf", "refactor", "style", "test"]
other_allowed_tags = ["chore"]

[tool.semantic_release.changelog]
mode = "init"

[tool.semantic_release.changelog.default_templates]
changelog_file = "./docs/changelog.md"

[tool.tox]
envlist = ["sqlmodel", "fastapi-pre121", "fastapi-post121"]

[tool.tox.env_run_base]
runner = "uv-venv-runner"
package = "editable"
dependency_groups = ["dev"]
uv_seed = true
commands = [
    [
        "python",
        "-m",
        "pytest",
        "--cov",
        "fastsqla",
        "--cov-report=term-missing",
        "--cov-report=xml",
    ],
]

[tool.tox.env.sqlmodel]
extras = ["sqlmodel"]

[tool.tox.env.fastapi-pre121]
commands_pre = [["python", "-m", "pip", "install", "-U", "fastapi<0.121"]]

[tool.tox.env.fastapi-post121]
commands_pre = [["python", "-m", "pip", "install", "-U", "fastapi>=0.121"]]
